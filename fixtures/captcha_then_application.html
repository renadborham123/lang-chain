<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Human verification fixture</title></head>
<body>
  <section id="challenge">
    <h1>Verify you are human</h1>
    <p>CAPTCHA</p>
  </section>
  <form id="application" hidden>
    <label>Full name <input name="full_name" autocomplete="name" required></label>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Resume <input name="resume" type="file" required></label>
    <button type="submit">Submit application</button>
  </form>
  <p id="result"></p>
  <script>
    window.setTimeout(() => {
      document.getElementById('challenge').remove()
      document.getElementById('application').hidden = false
    }, 800)
    document.getElementById('application').addEventListener('submit', event => {
      event.preventDefault()
      document.getElementById('result').textContent = 'Application submitted'
    })
  </script>
</body>
</html>
